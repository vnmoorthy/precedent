<!doctype html><meta charset="utf-8"><title>Precedent</title>
<style>
:root{--bg:#0d0f12;--card:#151a20;--line:#242c35;--ink:#e8edf2;--dim:#8b98a6;
--deny:#ff5c47;--allow:#3ddc84;--accent:#ffb454}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);
font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;padding:26px}
h1{font-size:19px;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:13px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:1fr;gap:22px}
@media(min-width:980px){.grid{grid-template-columns:380px 1fr}}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);
margin:0 0 10px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:9px;
padding:13px 15px;margin-bottom:9px}
.rule{font-size:14px;margin-bottom:5px}
.prov{color:var(--dim);font-size:12px}
.pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:99px;
letter-spacing:.08em;font-weight:600}
.deny{background:rgba(255,92,71,.14);color:var(--deny)}
.allow{background:rgba(61,220,132,.14);color:var(--allow)}
.d-card{border-left:3px solid var(--deny)}
.reason{white-space:pre-wrap;font-size:12.5px;color:var(--ink);margin-top:7px;
padding-top:7px;border-top:1px solid var(--line)}
.meta{color:var(--dim);font-size:11.5px;margin-top:6px}
.big{font-size:33px;font-weight:700;letter-spacing:-.02em}
.stats{display:flex;gap:26px;margin-bottom:16px}
.stat .l{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.1em}
.empty{color:var(--dim);font-size:13px;padding:18px 0}
</style>
<h1>Precedent</h1>
<div class="sub">Your team said it once. The agent hears it every time.</div>
<div class="stats">
  <div class="stat"><div class="big" id="nDeny">0</div><div class="l">denials</div></div>
  <div class="stat"><div class="big" id="mins">0</div><div class="l">reviewer min reclaimed</div></div>
  <div class="stat"><div class="big" id="usd">$0</div><div class="l">reclaimed (est.)</div></div>
  <div class="stat"><div class="big" id="nRule">0</div><div class="l">rulings</div></div>
  <div class="stat"><div class="big" id="ms">—</div><div class="l">median ms</div></div>
</div>
<div class="sub" style="margin-top:-8px">est. basis: one prevented repeat-review round ≈ 30 reviewer-minutes at $120/hr staff rate</div>
<div class="grid">
  <div><h2>Ruling ledger</h2><div id="rulings"></div></div>
  <div><h2>Live decisions</h2><div id="feed"><div class="empty">waiting for the agent…</div></div></div>
</div>
<script>
const lat=[];
fetch('/rulings').then(r=>r.json()).then(rs=>{
  document.getElementById('nRule').textContent=rs.filter(r=>r.active!==false).length;
  document.getElementById('rulings').innerHTML=rs.map(r=>`
    <div class="card" style="${r.active===false?'opacity:.35':''}">
      <div class="rule">#${r.id} ${esc(r.rule)}</div>
      <div class="prov">${esc(r.first_pr||'')} · raised ${r.recurrence||0}× · ${esc(r.first_author||'')}
        ${r.active===false?' · <b style="color:var(--accent)">ABLATED</b>':''}</div>
    </div>`).join('');
});
function esc(s){return String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}
function add(d){
  const f=document.getElementById('feed');
  if(f.querySelector('.empty'))f.innerHTML='';
  const deny=d.outcome==='deny';
  if(deny){const n=+document.getElementById('nDeny').textContent+1;
    document.getElementById('nDeny').textContent=n;
    document.getElementById('mins').textContent=n*30;
    document.getElementById('usd').textContent='$'+(n*60).toLocaleString();}
  if(d.latency_ms){lat.push(d.latency_ms);lat.sort((a,b)=>a-b);
    document.getElementById('ms').textContent=lat[Math.floor(lat.length/2)].toFixed(1)}
  const el=document.createElement('div');
  el.className='card'+(deny?' d-card':'');
  el.innerHTML=`<span class="pill ${deny?'deny':'allow'}">${deny?'DENIED':'ALLOWED'}</span>
    <span class="prov"> ${esc(d.path||'')}</span>
    ${deny?`<div class="reason">${esc(d.reason||'')}</div>`:''}
    <div class="meta">${esc(d.tool||'')} · ${(d.latency_ms||0).toFixed(1)}ms${d.ruling_id?' · ruling #'+d.ruling_id:''}</div>`;
  f.prepend(el);
}
fetch('/decisions').then(r=>r.json()).then(ds=>{ds.slice().reverse().forEach(add)});
new EventSource('/events').onmessage=e=>{try{add(JSON.parse(e.data))}catch{}};
</script>
